[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bfbg-transformer"
version = "0.1.0"
requires-python = ">=3.12"

# Cai editable (pip install -e .) de `import src.<...>` chay duoc tu moi thu
# muc, ke ca script goi truc tiep nhu `python scripts/train_bfbg.py`.
[tool.setuptools.packages.find]
include = ["src*"]
