# Nguồn dữ liệu + gán nhãn VT-consensus + chia tập.
# Nguyên tắc nhãn: xem docs/LESSONS_FROM_EVM_CODEBASE.md, mục 2
# (nguồn nhãn ≠ baseline engine).

sources:
  malicious_dirs: [data/raw/malicious]
  benign_dirs: [data/raw/benign]
  vt_reports_dir: data/vt_reports         # report VirusTotal JSON, tên file = sha256
  # Ngưỡng kích thước tối đa cho MỌI mẫu trước khi lift (CFGFast chi phí
  # siêu tuyến tính theo code size). 12 = 1,5× mẫu lift lớn nhất đã chứng
  # minh (7,78MB) - KHÔNG phải số tuỳ ý; xem docs/LESSONS_LEARNED.md mục 5.
  # Áp dụng cho mọi đợt thu thập sau (benign lẫn Trickbot Giai đoạn B).
  max_file_size_mb: 12
  # 5 family malicious đã chốt cho Giai đoạn B (xem docs/DATASET.md). Đây là
  # nguồn sự thật để chạy lại fetch_malware_samples.py --dry-run xác nhận
  # trạng thái. QakBot loại (không có trên MB), SystemBC loại (không phải
  # banking trojan). Lọc: size ≤ max_file_size_mb + dedup sha256 (KHÔNG lọc
  # near-dup ở bước fetch - đó là việc của split, lesson 4).
  malware_families: [TrickBot, Emotet, Dridex, IcedID, BumbleBee]

labeling:
  # Khoá trong JSON đặc trưng chứa số engine VT gắn nhãn malicious.
  agreement_key: num_engines_detected
  malicious_min_engines: 5                # >= ngưỡng -> malicious
  benign_max_engines: 0                   # <= ngưỡng -> benign; ở giữa = vùng xám, loại khỏi train
  # Engine dùng làm baseline so sánh -> KHÔNG được góp phiếu vào nhãn.
  excluded_engines: []
  # Phân tầng mức tin cậy nhãn (experiments/qa/check_label_confidence.py).
  confidence_tiers:
    high_min: 15
    medium_min: 5

split:
  train_ratio: 0.8
  group_key: null                         # vd campaign, compile_timestamp - kiểm tra rò rỉ giữa train/test

qa:
  min_fire_rate: 0.01                     # cảnh báo luật seed fire < 1% mẫu dương

boundary_flags:                           # co ham angr co the gop nham (src/bfbg/boundary_flags.py)
  min_spread: 4096                        # SPREAD: spread (byte) >= nguong ...
  max_coverage: 0.5                       #   ... va coverage < nguong
  far_gap: 1024                           # FAR_UNLINK: khe (byte) giua 2 segment coi la "xa"
  gap_tol: 16                             # khe (byte) van coi la lien mach (padding can le)
